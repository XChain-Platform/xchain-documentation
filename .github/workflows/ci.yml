name: CI

# xchain-documentation had no CI at all, while carrying 79 tests that guard
# consensus-relevant material rather than prose (found while auditing which
# repos' declared gates actually run anywhere):
#
#   protocol/constants.js       the canonical activation timestamps other repos
#                               vendor and drift-check their copies against
#   test/vectors.test.js        protocol test vectors run against the shipped
#                               reference implementation in protocol/reference-impl
#   test/action-example-fields  the field-count lint on the action docs, added
#                               after five DISPENSER v0 examples were found one
#                               field short, so anyone copying one encoded a
#                               dispenser that was rejected on chain
#
# A drift in any of those is a wrong answer given to an implementer, and until
# now nothing ran on a push to catch it.
#
# No services, no secrets, and exactly one sibling checkout (xchain-indexer,
# read as text by the flag-day literals suite; see that step).
#
# The near-hermeticity has a cost worth naming rather than rediscovering:
# a test that needs a SIBLING repo cannot run here, and node:test prints a skip
# as a pass. test/schema-table-coverage.test.js is the one that bit: its
# cross-repo half resolves xchain-decoder/-indexer/-hub beside this checkout,
# skipped on every run here, and three ROLLCALL tables reached a published
# database.md undocumented with this workflow green the whole way.
#
# So a cross-repo invariant does not get to live only in this suite. The rules
# moved to lib/schema-table-coverage.js, whose hermetic tests DO run here, and
# the invariant itself is enforced from the platform checkout, where the
# siblings exist, by XChain-Platform/bin/check-schema-table-doc-coverage.js on
# every ci-all sweep and every push. Same fix already made for the env-var
# coverage gate. Before adding a test that reads a sibling repo, give it a
# trigger that runs where the sibling is.

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

# Protected branches (master, develop) are exempt from cancellation, and that
# needs both lines rather than the second alone. `cancel-in-progress: false`
# only protects a run that has already started, while GitHub keeps just one
# PENDING run per group, so a newer push evicts a queued one regardless.
# Grouping per commit removes the contention: two protected-branch commits are
# never in the same group, so each reaches a verdict. Pull requests keep
# per-ref grouping and cancel freely, which is the point there.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-documentation

      # test/flag-day-literals.test.js reads xchain-indexer/src/protocol_changes.js
      # as a SIBLING checkout (../xchain-indexer relative to this repo's root,
      # per bin/generate-flag-days.js) and quietly SKIPS its drift and
      # completeness checks when that sibling is absent, which is exactly what
      # every push here had been doing: the generated protocol/flag-days.md page
      # could rot against the indexer's registry with this workflow green the
      # whole way. Checked out beside xchain-documentation, not nested, so the
      # generator's '../xchain-indexer' resolution finds it.
      #
      # Ref: the release branch on a release head (a PR from release/*), the
      # pushed/targeted branch otherwise. Matches the ref logic xchain-e2e-test's
      # CI already uses for the same sibling. The indexer repo is public, so the
      # default token reads it and this repo keeps holding no secrets.
      #
      # Only ONE sibling is checked out. The suites that read a sibling skip the
      # ones that are absent, and the env-var coverage suite applies its fleet
      # floor only when every sibling is present, so a partial set is judged on
      # what is here rather than accused of a broken scanner.
      - name: Check out xchain-indexer (flag-day registry read by the literals suite)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-indexer
          ref: ${{ startsWith(github.head_ref, 'release/') && github.head_ref || (github.ref == 'refs/heads/master' && 'master' || 'develop') }}
          path: xchain-indexer

      # Node 22 exactly: the platform's suites require it, and on some repos an
      # off-version run degrades into silent skips rather than failing.
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # mathjs is a devDependency here, pinned to the same exact 15.2.0 the
      # indexer, explorer, sdk and hub carry, because the reference
      # implementation must compute quorum weights the way the fleet does.
      # Only this tree needs installing: the flag-day generator READS the
      # indexer's registry as text (see the file-header note in
      # bin/generate-flag-days.js) rather than requiring it, so the sibling
      # checkout above needs no install of its own.
      - name: Install dependencies
        working-directory: xchain-documentation
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Documentation conformance suite
        working-directory: xchain-documentation
        run: npm test
